# Placeholder Deployment scaffold for the 5-replica acceptance tests
# (AC-01..AC-03 in the SDS). Replicas share one Postgres advisory-lock
# namespace; exactly one becomes leader and runs the clock.
#
# The manifest is finalized once the scheduler core (Phase 1) lands and the
# readiness/health probes are defined.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: d-cron-example
spec:
  replicas: 5
  selector:
    matchLabels:
      app: d-cron-example
  template:
    metadata:
      labels:
        app: d-cron-example
    spec:
      containers:
        - name: app
          image: d-cron-example:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: d-cron-example
                  key: database-url
            # Keepalives are MANDATORY (issue #14, SRS C-06): at PostgreSQL and
            # Linux defaults a dead or partitioned leader holds the advisory
            # lock for HOURS with no promotion.
            - name: DSN_KEEPALIVES
              value: "keepalives=1&keepalives_idle=60&keepalives_interval=10&keepalives_count=3"
          ports:
            - name: probes
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 5
          # terminationGracePeriodSeconds must exceed WithDrainTimeout (30s):
          # Stop() unlocks first, then drains in-flight jobs within the budget.
          terminationGracePeriodSeconds: 45
