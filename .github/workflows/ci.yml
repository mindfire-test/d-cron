name: CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  schedule:
    # Run govulncheck weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          check-latest: true

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting (gofumpt)
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          gofumpt -d .
          if [ -n "$(gofumpt -l .)" ]; then
            echo "The following files are not formatted with gofumpt:"
            gofumpt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v1.64.8
          verify: false
          args: --timeout=5m

  cross-build:
    name: Cross-Compilation Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          check-latest: true

      - name: Build dcron packages
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -v ./dcron/... ./metrics/... ./ui/... ./otel/...

  unit-tests:
    name: Unit Tests with Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          check-latest: true

      - name: Run Unit Tests (-race & coverage)
        run: |
          go test -v -race -coverprofile=coverage.out ./test/clock/... ./test/elector/... ./test/executor/... ./test/metrics/... ./test/otel/... ./test/scheduler/... ./test/store/... ./test/ui/...

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: coverage.out
          retention-days: 7

  integration-tests:
    name: Postgres Integration Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres-version: ['12', '16']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          check-latest: true

      - name: Run Real PostgreSQL Integration Tests (-race)
        env:
          POSTGRES_TEST_VERSION: ${{ matrix.postgres-version }}
        run: |
          cd test/integration
          go test -v -race -tags integration -timeout 15m .

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          check-latest: true

      - name: Run govulncheck
        continue-on-error: true
        env:
          GITHUB_ACTIONS: ""
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./... || echo "govulncheck reported findings (non-blocking informational scan)"
