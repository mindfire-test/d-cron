name: CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  schedule:
    # Run govulncheck weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.23'

      - name: Run go vet
        run: go vet ./...

      - name: Verify zero external dependencies in root go.mod
        run: |
          if grep -E '^\s*require\b' go.mod; then
            echo "ERROR: Root module must remain dependency-free. Found require in go.mod."
            exit 1
          fi
          echo "SUCCESS: Root go.mod has zero external dependencies."

      - name: Check formatting (gofumpt)
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          gofumpt -d .
          if [ -n "$(gofumpt -l .)" ]; then
            echo "The following files are not formatted with gofumpt:"
            gofumpt -l .
            exit 1
          fi

      - name: Run golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v1.64.8/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.8
          golangci-lint run --timeout=5m ./...

      - name: Verify Go documentation coverage (godoccheck)
        run: go run ./internal/tools/godoccheck


  cross-build:
    name: Cross-Compilation Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.23'

      - name: Build dcron packages
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -v ./dcron/... ./metrics/... ./ui/... ./otel/...

  unit-tests:
    name: Unit Tests with Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.23'

      - name: Run Unit Tests (-race & coverage)
        run: |
          go test -v -race -coverpkg=./... -coverprofile=coverage.out ./test/clock/... ./test/elector/... ./test/executor/... ./test/metrics/... ./test/otel/... ./test/scheduler/... ./test/store/... ./test/ui/...

      - name: Report and Enforce Coverage Threshold
        run: |
          go tool cover -func=coverage.out > coverage_report.txt
          cat coverage_report.txt
          TOTAL_COV=$(grep "total:" coverage_report.txt | awk '{print $3}' | tr -d '%')
          THRESHOLD="70.0"
          echo "Total statement coverage: ${TOTAL_COV}% (Threshold: ${THRESHOLD}%)"
          echo "### Unit Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Observed Coverage:** \`${TOTAL_COV}%\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Minimum Threshold:** \`${THRESHOLD}%\`" >> $GITHUB_STEP_SUMMARY
          awk -v cov="$TOTAL_COV" -v thresh="$THRESHOLD" 'BEGIN {
            if (cov + 0.0 < thresh + 0.0) {
              printf "ERROR: Coverage %.1f%% is below threshold %.1f%%\n", cov, thresh;
              exit 1;
            }
            printf "SUCCESS: Coverage %.1f%% meets or exceeds threshold %.1f%%\n", cov, thresh;
            exit 0;
          }'

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: unit-test-coverage
          path: coverage.out
          retention-days: 7

  integration-tests:
    name: Postgres Integration Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres-version: ['12', '16']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.23'

      - name: Run Real PostgreSQL Integration Tests (-race)
        env:
          POSTGRES_TEST_VERSION: ${{ matrix.postgres-version }}
        run: |
          cd test/integration
          go test -v -race -tags integration -timeout 15m .

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.10'
          check-latest: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
