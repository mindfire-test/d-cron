name: CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  schedule:
    # Run govulncheck weekly on Mondays at 00:00 UTC (SRS NFR-504)
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting (gofumpt)
        run: |
          go install mvdan.cc/gofumpt@latest
          gofumpt -d .
          if [ -n "$(gofumpt -l .)" ]; then
            echo "The following files are not formatted with gofumpt:"
            gofumpt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.58.0
          args: --timeout=5m

  cross-build:
    name: Cross-Compilation Matrix (NFR-404)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build dcron packages
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build ./dcron/...
          go build ./metrics/...
          go build ./ui/...
          go build ./otel/...

  unit-tests:
    name: Unit Tests with Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Unit Tests (-race & coverage)
        run: |
          go test -v -race -coverprofile=coverage.out ./test/clock/... ./test/elector/... ./test/executor/... ./test/metrics/... ./test/otel/... ./test/scheduler/... ./test/store/... ./test/ui/...

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage.out
          retention-days: 7

  integration-tests:
    name: Postgres Integration Matrix (SRS AC-10)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres-version: ['12', '16']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Real PostgreSQL Integration Tests (-race)
        env:
          POSTGRES_TEST_VERSION: ${{ matrix.postgres-version }}
        run: |
          cd test/integration
          go test -v -race -tags integration -timeout 15m .

  vulnerability-scan:
    name: Scheduled Vulnerability Scan (NFR-504)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
