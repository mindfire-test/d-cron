name: Release docs Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: "Build Docusaurus Documentation"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd apps/docs
          npm ci

      - name: Build Docusaurus
        run: |
          cd apps/docs
          npm run build

      - name: Set Git user
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Deploy to gh-pages branch
        run: |
          # Store the build artifacts
          mkdir -p /tmp/docusaurus-build
          cp -r apps/docs/build/* /tmp/docusaurus-build/

          # Cleanly switch to gh-pages branch, creating orphan if it doesn't exist
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          # Clear tracking directory safely
          git rm -rf . >/dev/null 2>&1 || true
          rm -rf *

          # Copy the build artifacts
          cp -r /tmp/docusaurus-build/* .

          # Check if there are any changes before committing
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "chore(docs): update documentation build"
            git push origin gh-pages
            echo "✅ Documentation deployed to gh-pages"
          else
            echo "No changes to commit"
          fi
